# commands.conf — how THIS project builds, and how it gets running.
#
# Read by the Package and Deploy phases (core/14-phases.md). core/ never encodes
# a toolchain; this file is where yours lives.
#
# Format:  KIND::TARGET::COMMAND
#   KIND    DEPS | PACKAGE | DEPLOY | EVIDENCE
#   TARGET  matches a TARGET:: label in surfaces.conf, or `default` for DEPS
#   COMMAND run from the project root
#
# The join with surfaces.conf is the point: a target you must verify but cannot
# run is a target nobody will dogfood. If automation genuinely is not possible,
# say so on purpose:
#
#   DEPLOY::<target>::MANUAL::<the steps, and why a human is required>
#
# A MANUAL line is a decision. A missing line is an oversight, and they must not
# look the same at Triage.
#
# --------------------------------------------------------------------------
# Everything below is an EXAMPLE. Delete it and write your own. Commands that
# belong to someone else's toolchain fail loudly, which is the better failure —
# but they still cost you the time it takes to find out.
# --------------------------------------------------------------------------

# What must exist before anything builds.
DEPS::default::echo "no dependencies to install — replace me"

# Produce the artifact, per target.
PACKAGE::Primary platform::echo "replace with your build command"
PACKAGE::Secondary platform::echo "replace with your build command"

# Get the artifact RUNNING, locally, so a human or a gate can use it.
#
# Deploy targets a CLEAN instance — a throwaway profile, a temp container, a
# simulator. Injecting into the environment you are already using is usually a
# MANUAL line, not a command; see core/14-phases.md.
DEPLOY::Primary platform::echo "replace with your local run command"
DEPLOY::Secondary platform::MANUAL::replace with the steps a human must take, and why

# A command a gate may cite as evidence: `ledger.sh add ... --evidence-cmd EVIDENCE::<name>`.
# ledger.sh runs it from the repo root and records the exit code and a sha256 of the output.
# Delete the example and name your own (your test suite, your linter).
EVIDENCE::tests::echo "replace with your test command"
