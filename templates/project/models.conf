# models.conf — which model ID runs each gate TIER in THIS setup.
#
# Read alongside core/08-models.md. That chapter says which gates deserve the strongest model and why;
# this file says what "strongest" and "mid" are called today. Model IDs change and old ones retire, so the
# kit never hard-codes one: runners (the gate agents in .claude/agents/, an Agent SDK or API adapter) read
# the ID from here, and `ledger.sh add --model <id>` records what was actually used.
#
# Format:  TIER::MODEL_ID::NOTE
#   TIER      strongest | mid | fast | interactive      (the words used on the gate cards' `model:` line)
#   MODEL_ID  a model ID or alias your runner accepts; `inherit` means "whatever the calling session uses"
#
# Which tier a gate takes is fixed by its card (core/cards/G*.md `model:`), not here. If a tier has no
# row, or the ID is wrong for your account, set it here; do not edit the cards.
#
# KEEP THIS CURRENT. A retired ID fails loudly, but a stale one that still resolves quietly runs a gate
# on a weaker model than 08-models.md prescribes, and the ledger's `model` field is the only trace.

strongest::claude-fable-5-1::G4 Ripple, G5 Proof, G6 Peer, G7 Threat: silent failure modes
mid::claude-sonnet-5-5::G1 Intent, G2 Scout, G3 Craft: judgment, recoverable if imperfect
fast::claude-haiku-5-5::routing and reconciliation, pattern matching against a table
interactive::inherit::G8 Dogfood: the bottleneck is driving the interface, not reasoning
