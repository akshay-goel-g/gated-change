# surfaces.conf — example: a data pipeline / ETL / analytics repo.
# Silent failure is the whole genre here: wrong numbers look exactly like right numbers.

T4::(^|/)(migrations?|ddl)/::Warehouse DDL — dropped columns and retyped fields are not reversible
T4::(^|/)(dbt_project\.yml|models/(marts|finance)/)::Tables other teams and dashboards read
T4::(^|/)(pii|privacy|retention|gdpr)(/|\.[a-z]+$)::Data protection — a retention bug is a compliance incident
T4::(^|/)(\.env[^/]*|secrets?|profiles\.yml)$::Warehouse credentials

T3::(^|/)(models/(staging|intermediate)|transforms?)/::Upstream of the marts — fan-out
T3::(^|/)(schedules?|dags?|orchestration)/::When and in what order things run
T3::(^|/)(sources?|ingest(ion)?)/::What enters the system
T2::(^|/)(tests?|checks?|quality)/::Data tests — loosening one is a change too
T1::(^|/)(notebooks?|scratch)/::Exploration
T0::\.md$::Docs

IGNORE::(^|/)(target|logs|dbt_packages)/::Build output

ACTION::T4::backfill-run::The job run showing the date range rewritten and the table it overwrote
ACTION::T4::prod-schedule-enable::The orchestrator screen showing the DAG un-paused and its next run time

TARGET::Full-history rebuild::run on a copy of prod, row counts compared before/after
TARGET::Incremental run::run twice — the second run must change nothing (idempotence)
TARGET::Late-arriving data::replay a day of events out of order
