# surfaces.conf — example: a backend REST or GraphQL API consumed by other teams or clients.

T4::(^|/)migrations?/::Schema migration — not reversible once run
T4::(^|/)(auth|oauth|jwt|tokens?|permissions?)(/|\.[a-z]+$)::Authn/authz — silent when wrong
T4::(^|/)(billing|payments?|ledger)(/|\.[a-z]+$)::Money
T4::(^|/)(\.env[^/]*|secrets?|config/prod)(/|\.[a-z]+$|$)::Secrets and production config
T4::(^|/)(openapi|swagger)\.(ya?ml|json)$::Public API contract — a breaking edit silently breaks every client

T3::(^|/)(routes|handlers|controllers|resolvers)/::Public surface
T3::(^|/)(middleware|lib|shared)/::Runs on every request
T3::(^|/)(models|entities|schema)(/|\.[a-z]+$)::Persisted shape
T3::(^|/)(queues?|consumers?|events?)/::Async contract — producers and consumers deploy separately
T2::(^|/)(services|features)/::Feature logic
T1::(^|/)tests?/::Tests only
T0::\.md$::Docs

IGNORE::(^|/)(vendor|node_modules|generated|dist)/::Not our code
IGNORE::\.(pb\.go|_pb2\.py)$::Generated protobuf

ACTION::T4::prod-deploy::Deploy pipeline run URL
ACTION::T4::api-version-sunset::The announcement/changelog entry and the date the old version stops answering
ACTION::T4::key-rotation::The secrets manager's rotation record, plus where the old key was revoked

TARGET::Current client version::contract tests against the latest released client
TARGET::Previous client version::contract tests against N-1 — old clients do not upgrade on your schedule
TARGET::Empty DB vs prod-sized DB::load test — a query that is fine on 100 rows is not fine on 10M
