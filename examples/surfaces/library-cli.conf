# surfaces.conf — example: a library or CLI published to a package registry.

# Q3: what can a user never undo? A published version.
T4::(^|/)(package\.json|pyproject\.toml|Cargo\.toml|go\.mod)$::Manifest — version, deps, entry points, install scripts
T4::(^|/)(src|lib)/(index|main|__init__)\.[a-z]+$::Public entry point — every export is now API
T4::(^|/)\.github/workflows/::CI/release workflow — can publish with your credentials
T4::(^|/)(\.npmrc|\.pypirc|\.env[^/]*)$::Registry credentials

T3::(^|/)(src|lib)/(core|internal)/::Shared internals
T3::(^|/)(cli|bin)/::Command-line surface — flags and exit codes are API
T3::(^|/)(config|schema)(/|\.[a-z]+$)::Config format — users have files written against it
T2::(^|/)(src|lib)/::Library code
T1::(^|/)(tests?|examples?)/::Tests and examples
T0::\.md$::Docs

IGNORE::(^|/)(dist|build|node_modules|target)/::Build output
IGNORE::(^|/)(package-lock\.json|Cargo\.lock|poetry\.lock)$::Lockfiles

ACTION::T4::registry-publish::The registry page or API response showing the new version — published versions cannot be unpublished
ACTION::T4::deprecate-version::The registry command output deprecating the version, and the replacement named in it

TARGET::Oldest supported runtime::CI matrix leg on the minimum version you claim
TARGET::Newest runtime::CI matrix leg on latest
TARGET::Windows / macOS / Linux::CI matrix — path handling and line endings differ
