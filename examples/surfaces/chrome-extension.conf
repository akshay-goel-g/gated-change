# surfaces.conf — example: a store-distributed browser extension (MV3).
# This is the shape the kit was first built around; templates/project/surfaces.conf has
# the same example with every row annotated at length.

T4::(^|/)manifest\.json$::Manifest — a permission change can disable the extension for every user
T4::\.pem$::Signing key — must never be committed
T4::(^|/)update\.xml$::Self-hosted update manifest
T4::(^|/)content[-_]?[Ss]cripts?(/|\.[a-z]+$)::Content script — full DOM access to the page
T4::(^|/)(auth|session|token)s?(/|\.[a-z]+$)::Trust boundary
# Replace with YOUR extension's silent-failure logic (a rule engine, an autofill matcher, a DOM-diff sync):
T4::(^|/)(engine|rules)/::Core logic — silent when wrong

T3::(^|/)(background|service-worker)(/|\.[a-z]+$)::Service worker — init order matters
T3::(^|/)(storage|schema)(/|\.[a-z]+$)::Persisted state — only breaks on the UPGRADE path
T3::(^|/)messag(e|es|ing)(/|\.[a-z]+$)::Cross-context message contract
T2::(^|/)(options|popup|sidepanel)/::User-facing settings
T1::\.(css|scss)$::Styling

IGNORE::(^|/)(node_modules|dist|build)/::Not our code

ACTION::T4::store-publish::Store console publish confirmation — a published version can never be reused or recalled
ACTION::T4::permission-delta::The store review's before/after permission-warning text
ACTION::T4::rollout-ramp::Staged-rollout percentage screen at the moment it changed
ACTION::T4::key-rotation::Store key-rotation confirmation, plus the new key's fingerprint
ACTION::T4::listing-edit::Before/after of the store listing or privacy disclosure

TARGET::Chrome (MV3)::e2e against a loaded-unpacked build
TARGET::Firefox::separate e2e — do not assume MV3 parity
TARGET::Fresh install vs upgrade::migration test — storage changes only break on upgrade
