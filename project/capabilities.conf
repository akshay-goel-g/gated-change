# capabilities.conf — what THIS setup can actually produce.
#
# Read alongside core/09-capabilities.md. That file says what a coding agent can
# and cannot make in general; this one says what your particular setup has wired
# up, which changes the routing: an agent with an image tool connected should use
# it, not propose it.
#
# Format:  ASSET::STATUS::HOW
#   STATUS  have    — wired up and usable right now
#           manual  — a human does it, name who
#           none    — nothing available; must be flagged at Triage as a gap
#
# KEEP THIS CURRENT. A stale entry causes exactly the silent substitution that
# core/09-capabilities.md exists to prevent: the agent believes a tool is missing
# and quietly makes do with something worse.

copy::have::the agent
docs::have::the agent
diagrams::have::mermaid / inline SVG
screenshots::have::browser automation against the running app
icons::none::flag at Triage — icon set, vector tool, or a designer
illustration::none::flag at Triage — image model or stock
video::none::flag at Triage — screen recorder plus an editor
audio::none::flag at Triage — sound library
fonts::have::open-licensed families, recommendation only
translation::manual::a native speaker reviews anything user-visible
legal::manual::not the agent's call, ever
production access::none::a human runs anything that touches production
