# commands.conf — how gated-change builds, and how it gets running.
#
# This is THIS repository's instance. The skeleton a new project starts from is
# templates/project/commands.conf.
#
# Read by the Package and Deploy phases (core/14-phases.md).
#
# Format:  KIND::TARGET::COMMAND
#   KIND    DEPS | PACKAGE | DEPLOY
#   TARGET  matches a TARGET:: label in surfaces.conf, or `default` for DEPS
#   COMMAND run from the project root

# The kit is shell, markdown and one HTML page. Nothing to install — and saying
# so explicitly is the point of the phase: an absent line reads as an oversight,
# a stated one reads as a decision.
DEPS::default::true   # bash, git, coreutils, openssl. All present or the kit does not run at all.

# --------------------------------------------------------------------------
# PACKAGE — produce the artifact.
#
# There is no build step for the kit itself; the repo is the artifact.
# Version comes from VERSION.
# --------------------------------------------------------------------------
PACKAGE::Git Bash on Windows::true   # the repo IS the artifact; nothing to package
PACKAGE::Linux/macOS bash::true   # the repo IS the artifact; nothing to package
PACKAGE::Installed at .pipeline/::true   # the repo IS the artifact; nothing to package
PACKAGE::The kit as its own repo::true   # the repo IS the artifact; nothing to package

# --------------------------------------------------------------------------
# DEPLOY — get it RUNNING, so a gate can use it.
#
# "Running" for this product means an installed copy in a throwaway repo, which
# is exactly what the suite's newrepo fixture builds. G8 Dogfood's input is that
# install, not this checkout — reviewing the kit from inside the kit is the blind
# spot that shipped every packaging defect it has had.
# --------------------------------------------------------------------------
DEPLOY::Git Bash on Windows::bash tests/run.sh
DEPLOY::Linux/macOS bash::MANUAL::no Linux runner is wired up yet. Until one is, this target has no evidence and Proof must say so rather than assume the shells agree — they have already disagreed once, over multibyte bracket expressions.
DEPLOY::Installed at .pipeline/::bash tests/run.sh test_install_
DEPLOY::The kit as its own repo::bash tools/dashboard.sh --check
