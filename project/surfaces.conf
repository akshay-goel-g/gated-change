# surfaces.conf — gated-change's own risky surfaces.
#
# SELF: gated-change
#
# This file is THIS repository's answers to the five questions, not a template.
# The example a new project starts from is `templates/surfaces.conf` — copy that
# one over this one when you install the kit somewhere else:
#
#   cp .pipeline/templates/surfaces.conf .pipeline/project/surfaces.conf
#
# reconcile.sh refuses to run if it finds the `SELF: gated-change` line above
# while inside an installed copy, because routing your project against the kit's
# trust boundaries fails OPEN — nothing of yours matches, every change lands at
# T0, and no gate is ever mandatory.
#
# Format:  TIER::REGEX::LABEL  ·  IGNORE::REGEX::LABEL   (see templates/surfaces.conf)

# --------------------------------------------------------------------------
# Q1 — what here, if it broke, would fail SILENTLY?
#
# All of these have already done it. The kit's entire defect history is tools
# returning a confident wrong answer rather than an error: reconcile reporting
# "no changes" on a working tree full of them, reconcile tiering T4 on its own
# filenames, a hook whose placeholder regex was valid and matched nothing,
# ledger.sh mandating gates the router does not.
# --------------------------------------------------------------------------
T4::(^|/)tools/(reconcile|ledger|install-hook|install-claude-hook|status)\.sh$::Routing and evidence — a wrong answer here is silent and confident
T4::(^|/)tools/lib/matrix\.sh$::The gate matrix reader — decides what is mandatory
T4::(^|/)tools/lib/coverage\.sh$::Decides what counts as unrouted — read by both status.sh and the dashboard
T4::(^|/)tools/lib/default-branch\.sh$::Resolves the repo's default branch — decides which --change names ledger.sh refuses, and read by the dashboard too
T4::(^|/)tools/lib/data-root\.sh$::Binds PIPELINE_DATA to the current repo — a wrong answer judges this repo by another project's rules and reports
T4::(^|/)tools/lib/commit\.sh$::Turns every stored or typed commit string into an object — a wrong answer binds a gate result to the wrong commit, silently
T4::(^|/)core/01-router\.md$::The gate matrix itself — every tool derives from it
T4::(^|/)project/commands\.conf$::What a gate may run as evidence — editing it changes what counts as proof
T4::(^|/)templates/pre-push$::Enforcement — its success is silent, so its failure is too
T4::(^|/)tools/hooks/::Enforcement — the R0c reminder's own success is silent, so its failure is too

# --------------------------------------------------------------------------
# Q3 — what can never be undone?   Q4 — where do secrets live?
#
# --------------------------------------------------------------------------
T4::(^|/)tools/update-kit\.sh$::Deletes and replaces directories in an installed kit — a wrong path here destroys a project's records

# --------------------------------------------------------------------------
# T3 — shared surfaces: one change, many consumers
# --------------------------------------------------------------------------
T3::(^|/)core/cards/::Gate cards — the unit handed to a subagent; every tool parses these
T3::(^|/)(templates|\.claude)/agents/pipeline-gate-[^/]+\.md$::Gate subagent definitions — the tool list, model and withhold rule a gate actually runs under
T3::(^|/)core/schemas/::Findings schema — what a gate returns must match what ledger.sh accepts
T3::(^|/)(templates/)?project/models\.conf$::Tier-to-model map — a stale ID quietly runs a gate on a weaker model
T3::(^|/)tools/check-refs\.sh$::Reference checker with several callers
T3::(^|/)tools/(dashboard|mine-registry)\.sh$::Tooling with several callers
T3::(^|/)templates/agent-instructions\.md$::Pasted into every adopting project's agent file
T3::(^|/)tests/run\.sh$::The suite — if it stops asserting, nothing else here is trustworthy

# --------------------------------------------------------------------------
# T2/T1 — the prose. Wrong docs mislead, but a reader notices; they do not fail
# silently. The exception is 00-start.md, which is the file a new user actually
# follows, so it is rated above the rest of core/.
# --------------------------------------------------------------------------
T2::(^|/)core/00-start\.md$::The adoption path — the one file a new user follows
T2::(^|/)README\.md$::The front door
T1::(^|/)core/[0-9]+-.*\.md$::Reference prose
T1::(^|/)tools/dashboard/::Dashboard assets

# --------------------------------------------------------------------------
# IGNORE — in the repo, not under review.
# --------------------------------------------------------------------------
IGNORE::(^|/)experiments/::Benchmark records — append-only history, not code under review
IGNORE::(^|/)LEARNINGS\.md$::Append-only record

# --------------------------------------------------------------------------
# Q2 — TARGETS. Every one needs evidence in the test gate.
#
# Q5 (what accumulates without a documented limit) is answered in ceilings.md:
# LEARNINGS.md and the ledger both grow without bound, by design.
# --------------------------------------------------------------------------
TARGET::Git Bash on Windows::tests/run.sh — the platform the kit is developed on, and the slow one
TARGET::Linux/macOS bash::tests/run.sh — process spawn is cheap here, so cost bugs hide
TARGET::Installed at .pipeline/::tests/run.sh's newrepo fixture — the documented install, where the kit is not the repo
TARGET::The kit as its own repo::INCLUDE_KIT=1 — where the kit IS the project and nothing is excluded
