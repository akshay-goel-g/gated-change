<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d"><title id="t">How a change moves through gated-change</title><desc id="d">A change is tiered from its real diff, sent through the gates that tier requires, and recorded in an append-only ledger that decides whether it is ready.</desc><rect width="980" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><text x="24" y="34" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">One change, start to finish</text><rect x="24" y="70" width="172" height="104" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="38" y="98" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">1  A change</text><text x="38" y="124" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">you or your agent</text><text x="38" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">edits files</text><rect x="214" y="70" width="172" height="104" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="228" y="98" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">2  Re-tier</text><text x="228" y="124" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">reconcile.sh reads the</text><text x="228" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">real diff, not your plan</text><rect x="404" y="70" width="172" height="104" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/><text x="418" y="98" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">3  Gates</text><text x="418" y="124" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">only the reviewers the</text><text x="418" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">tier requires, fresh session</text><rect x="594" y="70" width="172" height="104" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="608" y="98" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">4  Ledger</text><text x="608" y="124" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">every gate run is</text><text x="608" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">appended: pass/fail/skip</text><rect x="784" y="70" width="172" height="104" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="798" y="98" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">5  Ready?</text><text x="798" y="124" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">compliance answers from</text><text x="798" y="142" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#424a53" text-anchor="start">the ledger, not from memory</text><line x1="196" y1="122" x2="212" y2="122" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/><line x1="386" y1="122" x2="402" y2="122" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/><line x1="576" y1="122" x2="592" y2="122" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/><line x1="766" y1="122" x2="782" y2="122" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/><rect x="404" y="214" width="172" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/><text x="418" y="236" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Coupling registry</text><text x="418" y="254" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#424a53" text-anchor="start">what broke before, from git</text><line x1="490" y1="214" x2="490" y2="178" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/><path d="M680 178 L680 202 L110 202 L110 178" fill="none" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="24" y="224" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#cf222e" text-anchor="start">A failing gate sends the change back to step 1;</text><text x="24" y="241" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#cf222e" text-anchor="start">the fail stays on record until a later pass clears it.</text><text x="24" y="282" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Nothing leaves your machine: the ledger is a text file in your repo. Needs only bash and git.</text></svg>