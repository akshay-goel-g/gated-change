# surfaces.conf — what your project's risky surfaces are.
#
# This is the answer to the five questions, in machine-readable form. It is the
# only file reconcile.sh reads, and it is the main thing that differs between
# projects. core/ never encodes anything from here.
#
# Format:  TIER::REGEX::LABEL
#   TIER   T1..T4 — the MINIMUM tier a change touching this surface qualifies for
#   REGEX  matched against paths from `git diff --name-only` (extended regex)
#   LABEL  shown in the report, so a hit explains itself
#
#   IGNORE::REGEX::LABEL   paths that are in the repo but are not yours to
#                          review — vendored code, generated output, fixtures.
#                          Dropped before tiering, so they cannot raise a tier.
#
#   ACTION::TIER::NAME::EVIDENCE   an event with a tier and a NAME — no regex,
#                          because it changes no file. Declared explicitly with
#                          `bash reconcile.sh --action NAME --evidence "<citation>"`,
#                          never detected from a diff (there is nothing to diff).
#                          TIER    T1..T4, same meaning as above.
#                          NAME    what `--action` names on the command line.
#                          EVIDENCE  what a citation for THIS action should look
#                                    like — a screen, a URL, a response body —
#                                    same role TARGET's HOW_VERIFIED plays below.
#                                    The `--evidence` text supplied at invocation
#                                    is checked against this only for presence,
#                                    not shape or content — see "WHAT THIS FILE
#                                    STILL CANNOT ROUTE" below for why that is a
#                                    named gap, not an oversight.
#                          Rows below are examples for a store-distributed
#                          Chrome extension; the row's NAME is what you type
#                          after --action, so renaming one here without updating
#                          your release checklist breaks the checklist silently.
#
# Rule of thumb: if breaking it would be *silent*, it is T4. Visible breakage
# gets reported by users; silent breakage does not.
#
# MATCH A PATH SEGMENT, NOT A SUBSTRING OF A NAME. A bare keyword like `ledger`
# matches every path whose name merely contains the word — a doc called
# `04-ledger.md`, a fixture called `session-record.md` — and each false hit is a
# T4 the router now insists on gates for. Three identical misfires on one diff
# (experiments/003) is what put the warning in reconcile.sh; the rules below
# were the thing it was warning about. The forms that hold up:
#
#   (^|/)auth/           a directory named auth, anywhere
#   (^|/)auth\.[a-z]+$   a file named auth.<ext>
#   (^|/)manifest\.json$ one exact file
#
# The trade is real and worth stating: anchoring this way misses
# `auth-service.js`. Widen deliberately, per rule, when you have a file that
# needs it — a surfaces file that cries wolf gets ignored wholesale, and an
# ignored T4 rule protects nothing at all.
#
# --------------------------------------------------------------------------
# Everything below is an EXAMPLE from a browser-extension project.
# Delete it and write your own. Keeping someone else's surfaces is worse than
# having none, because it produces confident answers about the wrong things.
# --------------------------------------------------------------------------

# Q3 — what can a user never undo?
#
# manifest.json can silently re-prompt or DISABLE the extension for every
# existing user the moment a permission changes — the row below catches ANY
# edit to it, not just the permissions block, because a diff-based router
# cannot tell which part of the file changed without parsing it.
T4::(^|/)manifest\.json$::Manifest — permissions, host access
T4::(^|/)migrations?/::Data migration — not reversible once run
#
# A .pem is the signing/update key: leak it and anyone can ship as you, lose
# it and the item can never be updated again. This row exists to catch an
# ACCIDENTAL `git add` of one — it should never match a real diff, and if it
# ever does, that is the finding, not a false positive to silence.
T4::\.pem$::Signing/update key — must never be committed
T4::(^|/)update\.xml$::Self-hosted update manifest — a bad URL silently stops updates for everyone
T4::(^|/)(billing|payment|pricing|invoice|subscription)(/|\.[a-z]+$)::Money — irreversible for the business too
#
# Everything above this line changes a FILE. Everything below is the same Q3
# test ("what can a user never undo") applied to the events that don't — the
# gap LEARNINGS.md names as "the router can only tier a diff." Fire these with
# `bash reconcile.sh --action <name> --evidence "<citation>"` at release time,
# not at R0b — see 01-router.md's R0d for why that timing distinction matters.
ACTION::T4::store-publish::Store console Publish confirmation screen, or the store API's publish response — a version once published can never be reused or recalled
ACTION::T4::permission-delta::The store review's before/after permission-warning text, or a diff of the manifest's `permissions`/`host_permissions` block that a reviewer approved
ACTION::T4::rollout-ramp::The store console's staged-rollout percentage screen at the moment it was changed — ramping past a bad build is not undoable by lowering the number back
ACTION::T4::key-rotation::The store console's key-rotation confirmation, or the new key's fingerprint plus where the old one was retired — lose this key and the listing can never be updated again
ACTION::T4::listing-edit::A diff or screenshot of the store listing / privacy-disclosure text, before and after — this is often the ONLY place a data-collection change is disclosed to a user at all

# Q1 — what fails silently?
#
# Content scripts are the one row here that IS universal, unlike the
# placeholder below: any extension that injects one gets full DOM access to
# whatever page it runs on, often under all_urls — the highest-privilege,
# most silently-breakable surface a real MV3 extension has. A dogfight review
# caught this missing from an earlier draft of this exact example; do not
# repeat that gap by deleting the row below along with the placeholder.
T4::(^|/)content[-_]?[Ss]cripts?(/|\.[a-z]+$)::Content script — full DOM access to whatever page it runs on
#
# The row below IS a PLACEHOLDER, not a universal one — "core|engine" only
# means something once you have named YOUR extension's silent-failure logic:
# a blocker's rule engine, a password manager's autofill matcher, a
# translator's page-injection code, a note-taker's DOM-diff sync. Every
# extension has exactly one of these and none of them share a directory name
# — replace this row with yours; do not ship it as "core|engine" and assume
# it fires on the right files.
T4::(^|/)(core|engine)/::Core feature logic — REPLACE with YOUR silent-failure surface
T4::(^|/)(auth|session|token|credential|permission)s?(/|\.[a-z]+$)::Trust boundary
T4::(^|/)(quota|limits?|ledger)(/|\.[a-z]+$)::Quota accounting — races are silent

# Q4 — where do secrets live?
T4::(^|/)(\.env|secrets?|vault|keystore)(/|\.[a-z]+$|$)::Secrets

# T3 — shared surfaces: one change, many callers
T3::(^|/)(shared|common|utils|lib)/::Shared module — multiple consumers
# chrome.storage key/schema changes belong here too — they only surface on
# the upgrade path, never on a fresh install, so nothing exercises them until
# a real user with real data hits them.
T3::(^|/)(storage|persistence|schema|db)(/|\.[a-z]+$)::Persisted state
T3::(^|/)(background|worker|service-worker)(/|\.[a-z]+$)::Long-lived process — MV3 service-worker init order matters
T3::(^|/)(api|routes|handlers)/::Public surface others call
# The content-script <-> background message contract: a silent shape change
# breaks one side without the other side ever throwing an error.
T3::(^|/)(messages?|messaging)(/|\.[a-z]+$)::Message passing — cross-context contract

# T2 — feature-scoped
T2::(^|/)(components|features|pages|views)/::Feature code
T2::(^|/)(options|settings|popup|sidepanel|devtools)/::User-facing settings — every MV3 UI surface

# T1 — local
T1::\.(css|scss|less)$::Styling
T1::(^|/)(assets|icons|images)/::Static assets

# --------------------------------------------------------------------------
# IGNORE — in the repo, but not yours to review. Dropped before tiering.
# The kit's own directory is excluded automatically from TIERING
# (reconcile.sh, INCLUDE_KIT=1 overrides), so it does not need a row here for
# that purpose.
#
# That exclusion does NOT reach templates/pre-push: the pre-push hook reads
# this file's T4 rows directly and matches them against every changed path,
# including the kit's own installed directory. A generic T4 row written for
# your OWN data (e.g. a pattern like "ledger" for your project's business
# ledger) can therefore also match the kit's unrelated .pipeline/ledger.jsonl,
# and block a push on every gate-logging change alone. If that happens,
# either scope the row's regex to your own paths (e.g. anchor it under
# src/ or the directory your data actually lives in) or exclude the kit's
# install directory explicitly, the same way the rows above exclude
# node_modules/vendor/dist/build. Found by a fresh-context G8 Dogfood run
# that hit exactly this with the shipped EXAMPLE row below.
# --------------------------------------------------------------------------
IGNORE::(^|/)(node_modules|vendor|dist|build|third_party)/::Not our code
IGNORE::\.(min\.js|min\.css|map)$::Generated output
IGNORE::(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$::Lockfiles — reviewed as deps, not as diffs

# --------------------------------------------------------------------------
# WHAT THIS FILE CANNOT ROUTE. Read this before trusting a clean reconcile run.
#
# TIER::REGEX::LABEL rows above match a PATH, because `git diff --name-only`
# is their only input. The most irreversible events in an extension's life
# change no file at all: pressing Publish, ramping a staged rollout, a
# permission-warning delta a REVIEWER approved, rotating the signing key on
# the store side, editing the listing or privacy disclosure. All of that is T4
# by this file's own Q3 test — "what can a user never undo" — and no path-based
# row, however well written, can ever catch it. That is CLOSED now, not open:
# the ACTION:: rows above (`store-publish`, `permission-delta`, `rollout-ramp`,
# `key-rotation`, `listing-edit`) name exactly those five events, each with a
# tier and a description of what evidence should look like. Fire one with
# `bash reconcile.sh --action <name> --evidence "<citation>"` at the moment the
# event actually happens — 01-router.md's R0d documents the invocation and why
# it runs at Release, not at R0b.
#
# What "closed" does NOT mean, named rather than implied:
#
#   - Nothing detects the event automatically, and nothing FORCES it to be
#     declared. `--action` is a DECLARATION — if nobody remembers to run it
#     when they press Publish, the pipeline still cannot see it happened.
#     `ledger.sh compliance` checks whether a MANDATED GATE ran; it does not
#     (yet) check whether a release-shaped change ever exercised an ACTION row
#     at all, the way it already checks the former. That would be the natural
#     next mechanical check — named here as a real, deferred gap, not built in
#     this pass. Until it exists, remembering to invoke `--action` is process
#     discipline, the same honor-system shape R0b itself has always had for
#     whoever runs it.
#   - EVIDENCE is checked for PRESENCE only, not shape or content. A citation
#     of "yes I did it" satisfies `--evidence` exactly as well as a real URL
#     does — the same bar G7's `finding` citations hold today (a human-readable
#     pointer, not a verified artifact). Tightening that is a named, deferred
#     question, not a silent gap: see LEARNINGS.md.
#   - There is no retraction. An ACTION declared by mistake stays in the
#     ledger — append-only, same as every other record type here — and gets
#     corrected the way a bad ledger line always does: a superseding entry
#     that says so, never an edit to the original.
#
# `BASE=<last-release-tag> bash tools/reconcile.sh T4` (01-router.md, R0b) is
# the other, older mitigation — it still catches permission/trust DRIFT
# accumulated across several already-merged, path-based PRs. It is unaffected
# by any of this; ACTION rows cover the event-shaped half of the gap, BASE
# covers the diff-shaped half, and neither substitutes for the other.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# TARGETS — Q2. Every target listed here must have evidence in the test gate.
# Format: TARGET::LABEL::HOW_VERIFIED
# --------------------------------------------------------------------------
# Delete the Firefox row if you do not ship there — MV3 APIs are not 1:1 with
# Firefox's, so "it should work the same" is a guess either way.
TARGET::Chrome (MV3)::e2e suite against a loaded-unpacked extension
TARGET::Firefox (WebExtensions)::separate e2e suite — do not assume MV3 parity
TARGET::Fresh install vs upgrade::migration tests — chrome.storage schema changes only surface on upgrade
TARGET::Offline / degraded network::integration tests — a service worker that assumes network fails silently
