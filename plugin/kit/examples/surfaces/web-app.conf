# surfaces.conf — example: a server-rendered or SPA web app with a database.
# Copy to .pipeline/project/surfaces.conf and edit. Paths are examples; match YOUR tree.

# Q3 — what can a user never undo?
T4::(^|/)migrations?/::Database migration — not reversible once run against prod data
T4::(^|/)(billing|payments?|checkout|invoices?)(/|\.[a-z]+$)::Money — wrong charges are not undoable
T4::(^|/)(auth|sessions?|permissions?|rbac)(/|\.[a-z]+$)::Trust boundary — failure is a silent account takeover

# Q4 — where do secrets live?
T4::(^|/)(\.env[^/]*|secrets?)(/|\.[a-z]+$|$)::Secrets / environment config

# Q1 — what fails silently?
T4::(^|/)(jobs|workers|cron)/::Background jobs — failures land in a log nobody reads

T3::(^|/)(lib|shared|common)/::Shared module — many callers
T3::(^|/)(api|routes|controllers)/::Public surface other code calls
T3::(^|/)(models|schema)(/|\.[a-z]+$)::Persisted shape
T2::(^|/)(components|pages|views|features)/::Feature code
T1::\.(css|scss)$::Styling
T0::\.md$::Docs

IGNORE::(^|/)(node_modules|vendor|dist|build|\.next)/::Not our code
IGNORE::(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$::Lockfiles

# Events that change no file but cannot be undone — declare with:
#   bash .pipeline/tools/reconcile.sh --action prod-deploy --evidence "<CI run URL>"
ACTION::T4::prod-deploy::The CI run or deploy log URL that shipped this build to production
ACTION::T4::prod-migration-run::The migration tool's output showing which migrations ran, against which database
ACTION::T3::feature-flag-flip::The flag dashboard screen showing the flag, the audience percentage and the time

TARGET::Chrome / Firefox / Safari::Playwright e2e on all three engines
TARGET::Mobile viewport::e2e at 375px — layout bugs only show on a real small screen
TARGET::Fresh DB vs upgraded DB::migration test from the previous release's dump
